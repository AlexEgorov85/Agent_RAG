schema: spec-driven

# Контекст проекта (необязательно)
# Показывается ИИ при создании артефактов.
# Добавьте стек, соглашения, стиль, знания о предметной области и т.п.
# Пример:
#   context: |
#     Стек: TypeScript, React, Node.js
#     Используем conventional commits
#     Домен: платформа электронной коммерции

# Правила для артефактов (необязательно)
# Добавьте собственные правила для конкретных артефактов.
# Пример:
#   rules:
#     proposal:
#       - Держать предложения короче 500 слов
#       - Всегда включать раздел «Не цели»
#     tasks:
#       - Дробить задачи на части не более чем по 2 часа

# Указания для операций (необязательно)
# Добавьте рекомендации, как выполнять apply и archive.
# Это отдельно от правил артефактов выше.
# Пример:
#   operations:
#     apply:
#       guidance:
#         - Кратко формулировать итоги тестов
#     archive:
#       guidance:
#         - Резюмировать результат архивации перед завершением
